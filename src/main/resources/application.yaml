spring:
  application:
    name: gokchu
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gokchu}
    username: ${DB_USERNAME:gokchu}
    password: ${DB_PASSWORD:gokchu}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

youtube:
  api-key: ${YOUTUBE_API_KEY:}
  base-url: https://www.googleapis.com/youtube/v3

admin:
  password: ${ADMIN_PASSWORD:changeme}
  token-secret: ${ADMIN_TOKEN_SECRET:local-dev-secret-change-me}
  token-ttl-seconds: ${ADMIN_TOKEN_TTL_SECONDS:43200}

server:
  port: 8080
